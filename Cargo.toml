[workspace]
members = [
  "crates/core",
  "crates/crypto",
  "crates/vault",
  "crates/protocol",
  "crates/bitwarden-compat",
  "crates/sync",
  "crates/client",
  "crates/desktop-core",
  "crates/wasm",
  "desktop/src-tauri",
  "server",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.92"
license = "AGPL-3.0-or-later"
repository = "https://github.com/hasilan/hasilan-pass"

[workspace.dependencies]
aes = "0.8.4"
anyhow = "1.0.99"
argon2 = { version = "0.5.3", features = ["zeroize"] }
async-trait = "0.1.89"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
base64 = "0.22.1"
bip39 = { version = "2.2.0", default-features = false, features = ["std"] }
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
chrono = { version = "0.4.41", features = ["serde"] }
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.45", features = ["derive", "env"] }
data-encoding = "2.9.0"
getrandom = { version = "0.3.3", features = ["std", "wasm_js"] }
hex = "0.4.3"
hkdf = "0.12.4"
hmac = "0.12.1"
http = "1.3.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
pbkdf2 = "0.12.2"
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
percent-encoding = "2.3.2"
psl = "2.1.141"
rand = "0.9.2"
regex = "1.11.1"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"] }
secrecy = "0.10.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha1 = "0.10.6"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "signal", "fs"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["cors", "trace", "request-id", "limit", "catch-panic", "set-header", "fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "reqwest"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.0", features = ["v4", "serde", "js"] }
webauthn-authenticator-rs = { version = "0.5.4", features = ["softpasskey"] }
webauthn-rs = { version = "0.5.4", features = ["danger-allow-state-serialisation"] }
zeroize = { version = "1.8.1", features = ["derive"] }
wasm-bindgen = "0.2.127"
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
