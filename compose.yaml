name: hasilan-pass

services:
  secret-init:
    build:
      context: .
      target: secret-init
    network_mode: none
    restart: "no"
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - hasilan-secrets:/run/hasilan-secrets

  db:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    depends_on:
      secret-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${HP_DATABASE_NAME:-hasilan}
      POSTGRES_USER: ${HP_DATABASE_USER:-hasilan}
      POSTGRES_PASSWORD_FILE: /run/hasilan-secrets/database_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - hasilan-secrets:/run/hasilan-secrets:ro
    networks:
      - backend

  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    init: true
    depends_on:
      secret-init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      HP_DATABASE_HOST: db
      HP_DATABASE_PORT: "5432"
      HP_DATABASE_NAME: ${HP_DATABASE_NAME:-hasilan}
      HP_DATABASE_USER: ${HP_DATABASE_USER:-hasilan}
      HP_DATABASE_PASSWORD_FILE: /run/hasilan-secrets/database_password
      HP_TOKEN_PEPPER_FILE: /run/hasilan-secrets/token_pepper
      HP_MFA_ENCRYPTION_KEY_FILE: /run/hasilan-secrets/mfa_encryption_key
      HP_BIND: 0.0.0.0:8080
      HP_PUBLIC_URL: ${HP_PUBLIC_URL:-http://localhost:8080}
      HP_ALLOWED_ORIGINS: ${HP_ALLOWED_ORIGINS:-http://localhost:8080}
      HP_WEBAUTHN_ORIGIN: ${HP_WEBAUTHN_ORIGIN:-http://localhost:8080}
      HP_WEBAUTHN_RP_ID: ${HP_WEBAUTHN_RP_ID:-localhost}
      HP_WEBAUTHN_RP_NAME: ${HP_WEBAUTHN_RP_NAME:-Hasilan Pass}
      HP_WEBAUTHN_ADDITIONAL_ORIGINS: ${HP_WEBAUTHN_ADDITIONAL_ORIGINS:-chrome-extension://idknmeojelkflflogppfklcfbfamnbnb,moz-extension://ihkchkcogibgnbilcnedillnbfijofddbmgmjhlhphajhngcmbkngbblcmeelhph}
      HP_PRODUCTION: ${HP_PRODUCTION:-false}
      HP_ACCESS_TOKEN_TTL_SECONDS: ${HP_ACCESS_TOKEN_TTL_SECONDS:-900}
      HP_REFRESH_TOKEN_TTL_SECONDS: ${HP_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      HP_TRUSTED_DEVICE_TTL_SECONDS: ${HP_TRUSTED_DEVICE_TTL_SECONDS:-2592000}
      HP_ATTACHMENT_MAX_BYTES: ${HP_ATTACHMENT_MAX_BYTES:-1073741824}
      HP_INVITATION_DELIVERY: ${HP_INVITATION_DELIVERY:-manual}
      HP_SMTP_HOST: ${HP_SMTP_HOST:-}
      HP_SMTP_PORT: ${HP_SMTP_PORT:-}
      HP_SMTP_TLS: ${HP_SMTP_TLS:-starttls}
      HP_SMTP_FROM: ${HP_SMTP_FROM:-}
      HP_SMTP_USERNAME: ${HP_SMTP_USERNAME:-}
      HP_SMTP_PASSWORD_FILE: ${HP_SMTP_PASSWORD_FILE:-}
      HP_SMTP_TIMEOUT_SECONDS: ${HP_SMTP_TIMEOUT_SECONDS:-10}
      RUST_LOG: ${RUST_LOG:-hasilan_server=info,tower_http=info}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    volumes:
      - hasilan-secrets:/run/hasilan-secrets:ro
    networks:
      - backend

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      HP_SITE_ADDRESS: :8080
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    ports:
      - "${HP_HTTP_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - frontend
      - backend

volumes:
  postgres-data:
  hasilan-secrets:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
    internal: true
