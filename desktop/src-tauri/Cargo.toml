[package]
name = "hasilan-desktop"
description = "Hasilan Pass native desktop client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "hasilan_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64.workspace = true
chrono.workspace = true
hasilan-desktop-core = { path = "../../crates/desktop-core" }
hasilan-protocol = { path = "../../crates/protocol" }
hasilan-vault = { path = "../../crates/vault" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.11.5", features = ["tray-icon"] }
tokio.workspace = true
url.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", default-features = false }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tauri-plugin-single-instance = "2.4.3"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[lints]
workspace = true
