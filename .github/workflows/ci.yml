name: CI

on:
  # Pull requests are the normal branch validation path. Push validation is limited to
  # the protected default branch so a PR branch cannot run the same suite twice.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  changes:
    name: Classify changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.classify.outputs.rust }}
      frontend: ${{ steps.classify.outputs.frontend }}
      desktop: ${{ steps.classify.outputs.desktop }}
      android: ${{ steps.classify.outputs.android }}
      integration: ${{ steps.classify.outputs.integration }}
      e2e: ${{ steps.classify.outputs.e2e }}
      compose: ${{ steps.classify.outputs.compose }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
    steps:
      - name: Check out source history
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          changed_files="$RUNNER_TEMP/changed-files"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            # GITHUB_SHA is the checkout's merge ref, so this also works for fork PRs
            # whose head repository is not available as a local remote.
            head="$GITHUB_SHA"
            # Disable rename detection so both the removed and added paths classify a
            # refactor conservatively instead of allowing a move to hide its old class.
            git diff --name-only --no-renames "$base" "$head" > "$changed_files"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && '${{ github.event.before }}' != '0000000000000000000000000000000000000000' ]]; then
            git diff --name-only --no-renames '${{ github.event.before }}' "$GITHUB_SHA" > "$changed_files"
          else
            # Scheduled and manually dispatched runs deliberately exercise the full suite.
            printf '%s\n' '.github/workflows/ci.yml' > "$changed_files"
          fi

          full_suite=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            full_suite=true
          fi

          set_output() {
            local output_name="$1"
            local path_pattern="$2"
            if [[ "$full_suite" == true ]] || grep -Eq "$path_pattern" "$changed_files"; then
              printf '%s=true\n' "$output_name" >> "$GITHUB_OUTPUT"
            else
              printf '%s=false\n' "$output_name" >> "$GITHUB_OUTPUT"
            fi
          }

          # Workflow/build manifests are included in every class so changes to the gate
          # itself cannot accidentally bypass a platform or integration check.
          build_files='(^|/)(Cargo\.toml|Cargo\.lock|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|deny\.toml)$|^\.github/workflows/|^scripts/'
          set_output rust "^((Cargo|deny\.toml)|server/|crates/|fuzz/|migrations/|desktop/src-tauri/|scripts/build-wasm\.sh|\.github/workflows/)"
          set_output frontend "^(web/|extension/|desktop/(src|ui|public)/|desktop/package\.json|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|crates/wasm/|crates/client/|crates/core/|scripts/|\.github/workflows/)"
          # Every workspace crate can be pulled into the native desktop or Android
          # dependency graph (desktop-core also reaches bitwarden-compat), so keep
          # platform compilation coverage for all crate changes.
          set_output desktop "^(desktop/|crates/|Cargo|pnpm|package\.json|scripts/|\.github/workflows/)"
          set_output android "^(desktop/src-tauri/|crates/|Cargo|pnpm|package\.json|scripts/|\.github/workflows/)"
          set_output integration "^(server/|crates/|migrations/|Cargo|compose|Dockerfile|scripts/|\.github/workflows/)"
          set_output e2e "^(web/|extension/|server/|crates/|migrations/|Cargo|pnpm|package\.json|scripts/|compose|Dockerfile|\.github/workflows/)"
          set_output compose "^(compose|Dockerfile|docker/|scripts/(backup|restore)|server/|migrations/|\.github/workflows/)"
          set_output dependencies "$build_files|^fuzz/Cargo\.lock$|^[^/]+/package\.json$"

  rust:
    name: Rust format, lint, and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install the workspace Rust toolchain
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, and Rust target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run strict Clippy
        run: cargo clippy --workspace --exclude hasilan-desktop --all-targets --all-features -- -D warnings
      - name: Run Rust tests
        run: cargo test --workspace --exclude hasilan-desktop --all-features

  frontend:
    name: Web and extension
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust and the WASM target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, target, and wasm-bindgen
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-wasm-bindgen-0.2.127-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-wasm-bindgen-0.2.127-
      - name: Install wasm-bindgen CLI when the cache is cold
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0.2.127'; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Keep all release-facing versions synchronized
        run: pnpm verify:release-version
      - name: Generate shared Rust WASM bindings
        run: ./scripts/build-wasm.sh
      - name: Run frontend security and type lint
        run: pnpm lint:frontend
      - name: Run frontend unit tests
        run: pnpm test:frontend
      - name: Build Web Vault and extension
        run: |
          pnpm --dir web build
          pnpm --dir extension build
      - name: Validate the Firefox extension package
        run: pnpm --dir extension lint:firefox

  desktop:
    name: Native desktop
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Tauri Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal --component clippy
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, and Rust target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-
      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile --filter @hasilan/desktop...
      - name: Lint and test desktop layers
        run: |
          pnpm --dir desktop check
          pnpm --dir desktop test
          cargo clippy --package hasilan-desktop-core --package hasilan-desktop --all-targets --all-features -- -D warnings
          cargo test --package hasilan-desktop-core --package hasilan-desktop --all-features
      - name: Build the native desktop executable
        run: pnpm --dir desktop tauri build --no-bundle

  android:
    name: Android client
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install JDK, Rust, and Android targets
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Configure Rust and Android SDK components
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target aarch64-linux-android,x86_64-linux-android
          rustup default 1.92.0
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
          printf 'NDK_HOME=%s\n' "${ANDROID_HOME}/ndk/27.3.13750724" >> "$GITHUB_ENV"
          ndk_bin="${ANDROID_HOME}/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '%s\n' "$ndk_bin" >> "$GITHUB_PATH"
          {
            printf 'CC_aarch64_linux_android=%s\n' "$ndk_bin/aarch64-linux-android24-clang"
            printf 'AR_aarch64_linux_android=%s\n' "$ndk_bin/llvm-ar"
            printf 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=%s\n' "$ndk_bin/aarch64-linux-android24-clang"
            printf 'CC_x86_64_linux_android=%s\n' "$ndk_bin/x86_64-linux-android24-clang"
            printf 'AR_x86_64_linux_android=%s\n' "$ndk_bin/llvm-ar"
            printf 'CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=%s\n' "$ndk_bin/x86_64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Cache Cargo registry, git sources, and Android Rust targets
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            desktop/src-tauri/gen/android/.gradle
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-android-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'desktop/src-tauri/gen/android/**/*.gradle*', 'desktop/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-android-
      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile --filter @hasilan/desktop...
      - name: Build x86_64 test APK with Tauri
        # Tauri owns the Rust/JNI build connection. Produce the emulator ABI before Gradle runs
        # the device test, then avoid asking Gradle to recreate that transient Tauri connection.
        run: pnpm --dir desktop tauri android build --debug --target x86_64 --apk --ci
      - name: Check Android Rust, Kotlin, parser, and instrumentation-test compilation
        run: |
          cargo check --package hasilan-desktop --target aarch64-linux-android
          cd desktop/src-tauri/gen/android
          ./gradlew :app:testUniversalDebugUnitTest :app:lintUniversalDebug :app:compileUniversalDebugAndroidTestKotlin
      - name: Enable KVM for the main-branch Android emulator
        if: github.event_name != 'pull_request'
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi
      - name: Run Android device security smoke test
        if: github.event_name != 'pull_request'
        # The AOSP image deliberately avoids Play Services: the app's basic vault flow must not
        # depend on Google services. Pin the action commit for reproducible CI execution.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          # API 34 keeps the Android WebView/Tauri lifecycle smoke deterministic on
          # hosted runners while still exercising the production targetSdk 36 app.
          api-level: 34
          target: default
          arch: x86_64
          # Use software rendering and disable Vulkan for deterministic headless WebView
          # startup; API 34 avoids the API 35 emulator/WebView lifecycle crash.
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          # The emulator can report boot completion before the settings service is ready.
          # Let the smoke script wait for package/activity services instead of failing here.
          disable-animations: true
          disable-linux-hw-accel: auto
          # Start the host ADB daemon before QEMU boots so the emulator does not race its
          # first settings/input service calls against adb server initialization.
          pre-emulator-launch-script: adb start-server
          script: |
            # The universal flavor normally compiles every ABI. Restrict this device gate to
            # the emulated x86_64 ABI. Tauri produced its shared Rust cdylib in the preceding
            # step, so Gradle must not re-enter Tauri's one-shot build connection here.
            adb wait-for-device && ready=0 && for attempt in $(seq 1 90); do if adb shell cmd package list packages >/dev/null 2>&1 && adb shell cmd activity get-config >/dev/null 2>&1; then ready=1; break; fi; sleep 2; done && test "$ready" -eq 1
            cd desktop/src-tauri/gen/android && if ./gradlew :app:connectedUniversalDebugAndroidTest -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 -x :app:rustBuildX86_64Debug --stacktrace; then :; else echo 'Android instrumentation logcat:'; adb logcat -d -v threadtime -t 1000 || true; exit 1; fi
      - name: Build arm64 debug APK and AAB
        if: github.event_name != 'pull_request'
        run: pnpm --dir desktop tauri android build --debug --target aarch64 --apk --aab --ci
      - name: Preserve Android smoke artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-debug
          path: |
            desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            desktop/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 14

  desktop-platform:
    name: Native desktop (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
            executable: target/release/hasilan-desktop.exe
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, and Rust target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-
      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile --filter @hasilan/desktop...
      - name: Compile the Windows-native executable
        run: pnpm --dir desktop tauri build --no-bundle
      - name: Require the expected native executable
        run: >-
          node -e "const fs=require('node:fs');if(!fs.existsSync(process.argv[1]))throw new Error('native executable was not produced')"
          "${{ matrix.executable }}"

  integration:
    name: PostgreSQL API and native-client journey
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: hasilan_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hasilan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, and Rust target
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-
      - name: Run the complete PostgreSQL journey
        env:
          HP_TEST_DATABASE_URL: postgresql://postgres:integration-only-password@127.0.0.1:5432/hasilan_test
        run: cargo test --package hasilan-server --test api_journey -- --nocapture

  e2e:
    name: Web and installed-extension cross-client journey
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17.10-alpine3.23
        env:
          POSTGRES_DB: hasilan_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: e2e-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hasilan_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:e2e-only-password@127.0.0.1:5432/hasilan_e2e
      HP_BIND: 127.0.0.1:18080
      HP_PUBLIC_URL: http://localhost:18080
      HP_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:19090
      HP_WEBAUTHN_ORIGIN: http://localhost:5173
      HP_WEBAUTHN_RP_ID: localhost
      HP_PRODUCTION: "false"
      HP_E2E_API_URL: http://127.0.0.1:18080
      HP_DEV_API_TARGET: http://127.0.0.1:18080
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust and the WASM target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, target, and wasm-bindgen
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-wasm-bindgen-0.2.127-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-1.92.0-wasm-bindgen-0.2.127-
      - name: Install wasm-bindgen CLI when the cache is cold
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0.2.127'; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Cache Playwright browsers
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-${{ runner.arch }}-
      - name: Install locked dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir web exec playwright install --with-deps chromium
          ./scripts/build-wasm.sh
      - name: Generate independent ephemeral server secrets
        run: |
          token_pepper=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          mfa_key=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\n')
          echo "::add-mask::$token_pepper"
          echo "::add-mask::$mfa_key"
          printf 'HP_TOKEN_PEPPER=%s\n' "$token_pepper" >> "$GITHUB_ENV"
          printf 'HP_MFA_ENCRYPTION_KEY=%s\n' "$mfa_key" >> "$GITHUB_ENV"
      - name: Start the API server
        run: |
          cargo build --locked --package hasilan-server
          target/debug/hasilan-server > "$RUNNER_TEMP/hasilan-server.log" 2>&1 &
          server_pid=$!
          printf 'HP_SERVER_PID=%s\n' "$server_pid" >> "$GITHUB_ENV"
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/ready >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              sed -n '1,200p' "$RUNNER_TEMP/hasilan-server.log" >&2
              exit 1
            fi
            sleep 1
          done
          sed -n '1,200p' "$RUNNER_TEMP/hasilan-server.log" >&2
          exit 1
      - name: Run the Web Vault journey
        run: pnpm --dir web test:e2e
      - name: Run extension autofill, save, sync, and Web confirmation
        run: pnpm --dir extension test:e2e
      - name: Stop the API server
        if: always()
        run: |
          if [[ -n ${HP_SERVER_PID:-} ]] && kill -0 "$HP_SERVER_PID" 2>/dev/null; then
            kill "$HP_SERVER_PID"
            wait "$HP_SERVER_PID" || true
          fi

  audit:
    # Keep the historical required check name while moving the slower dependency
    # audits into the separate dependency-audit job below.
    name: Dependency, license, and secret audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Scan the repository for committed secrets
        run: ./scripts/check-secrets.sh

  dependency-audit:
    name: Dependency and license audit
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || needs.changes.outputs.dependencies == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust audit tools
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, and audit tools
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-audit-0.22.2-0.20.2-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock', 'pnpm-lock.yaml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-audit-0.22.2-0.20.2-
      - name: Install cargo-audit and cargo-deny when the cache is cold
        run: |
          if ! cargo-audit --version 2>/dev/null | grep -q '0.22.2'; then
            cargo install cargo-audit --version 0.22.2 --locked
          fi
          if ! cargo-deny --version 2>/dev/null | grep -q '0.20.2'; then
            cargo install cargo-deny --version 0.20.2 --locked
          fi
      - name: Audit Rust advisories
        # sqlx's metapackage records its disabled MySQL backend (and rsa) in
        # Cargo.lock. cargo-deny below checks the activated feature graph and
        # verifies that RUSTSEC-2023-0071 is not reachable by this workspace.
        run: cargo audit --ignore RUSTSEC-2023-0071
      - name: Audit fuzz-harness advisories
        run: cargo audit --file fuzz/Cargo.lock
      - name: Enforce Rust licenses, bans, and sources
        run: cargo deny check
      - name: Audit production frontend dependencies
        run: pnpm audit --prod --audit-level high

  fuzz:
    name: Parser fuzz smoke
    needs: changes
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust nightly
        run: |
          rustup toolchain install nightly-2026-08-01 --profile minimal
      - name: Cache fuzz Cargo registry, git sources, target, and cargo-fuzz
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-nightly-2026-08-01-cargo-fuzz-0.13.2-${{ hashFiles('fuzz/Cargo.lock', 'fuzz/**/*.rs') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-nightly-2026-08-01-cargo-fuzz-0.13.2-
      - name: Install cargo-fuzz when the cache is cold
        run: |
          if ! cargo-fuzz --version 2>/dev/null | grep -q '0.13.2'; then
            cargo install cargo-fuzz --version 0.13.2 --locked
          fi
      - name: Build all fuzz targets
        run: cargo +nightly-2026-08-01 fuzz build
      - name: Smoke every untrusted-input boundary
        run: |
          for target in bitwarden_import vault_json protocol_json uri_match; do
            cargo +nightly-2026-08-01 fuzz run "$target" "fuzz/corpus/$target" -- -max_total_time=10 -rss_limit_mb=2048
          done

  containers:
    name: Clean-clone Compose, backup, and restore
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      COMPOSE_PROJECT_NAME: hasilan-ci
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Validate development and production Compose models
        run: |
          docker compose config --quiet
          HP_HOSTNAME=passwords.example.test docker compose -f compose.yaml -f compose.production.yaml config --quiet
      - name: Build and start from the clean checkout
        run: docker compose up --build --detach --wait
      - name: Verify proxy, API, and security headers
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready | grep '"database":"ok"'
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/headers" --output "$RUNNER_TEMP/index.html" http://127.0.0.1:8080/
          grep --ignore-case '^Content-Security-Policy:' "$RUNNER_TEMP/headers"
          grep --ignore-case '^X-Content-Type-Options: nosniff' "$RUNNER_TEMP/headers"
      - name: Exercise backup and guarded restore
        run: |
          mkdir -p "$RUNNER_TEMP/backups"
          ./scripts/backup.sh "$RUNNER_TEMP/backups"
          backup_directory=$(find "$RUNNER_TEMP/backups" -mindepth 1 -maxdepth 1 -type d -print -quit)
          HP_RESTORE_CONFIRM=restore-hasilan-pass ./scripts/restore.sh "$backup_directory"
          curl --fail --silent --show-error http://127.0.0.1:8080/health/ready | grep '"database":"ok"'
      - name: Remove synthetic Compose data
        if: always()
        run: docker compose down --volumes --remove-orphans
