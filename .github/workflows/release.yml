name: Release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag_release: ${{ steps.release.outputs.tag_release }}
    steps:
      - name: Check out complete source history
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Match every product version to the tag
        id: release
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version=$(node scripts/verify-release-version.mjs "$GITHUB_REF_NAME")
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
            tag_release=true
          else
            version=$(node scripts/verify-release-version.mjs)
            tag_release=false
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'tag_release=%s\n' "$tag_release" >> "$GITHUB_OUTPUT"
      - name: Require a successful CI run for tagged releases
        if: steps.release.outputs.tag_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')
          if [[ "$successful_ci" -lt 1 ]]; then
            echo 'no successful CI run was found for the tagged commit' >&2
            exit 1
          fi

  portable:
    name: Server, Web Vault, and browser extensions
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust, WASM, and packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends file unzip zip
          rustup toolchain install 1.92.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.92.0
      - name: Cache Cargo registry, git sources, and wasm-bindgen
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-0.2.127-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-wasm-bindgen-0.2.127-
      - name: Install wasm-bindgen CLI when the cache is cold
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -q '0.2.127'; then
            cargo install wasm-bindgen-cli --version 0.2.127 --locked
          fi
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the native server and browser clients
        run: |
          cargo build --locked --release --package hasilan-server
          ./scripts/build-wasm.sh
          pnpm --dir web build
          pnpm --dir extension build
      - name: Stage and inspect portable release packages
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release/packages release/metadata
          source_epoch=$(git show --no-patch --format=%ct HEAD)
          file target/release/hasilan-server | grep 'ELF 64-bit'
          ldd --version | head -n 1 > release/metadata/server-linux-x86_64-gnu-runtime.txt
          ldd target/release/hasilan-server >> release/metadata/server-linux-x86_64-gnu-runtime.txt
          server_stage="$RUNNER_TEMP/hasilan-server-stage"
          mkdir -p "$server_stage"
          cp target/release/hasilan-server LICENSE README.md "$server_stage/"
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 --numeric-owner -czf "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-server-linux-x86_64-gnu.tar.gz" -C "$server_stage" .
          tar --sort=name --mtime="@$source_epoch" --owner=0 --group=0 --numeric-owner -czf "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-web-vault.tar.gz" -C web/dist .
          pushd extension/dist
          zip -X -q -r "$GITHUB_WORKSPACE/release/packages/hasilan-pass-${HP_RELEASE_VERSION}-chromium.zip" .
          popd
          pnpm --dir extension package:firefox
          mapfile -t firefox_packages < <(find extension/artifacts -maxdepth 1 -type f -name '*.zip' -print)
          if [[ ${#firefox_packages[@]} -ne 1 ]]; then
            printf 'expected one Firefox package, found %s\n' "${#firefox_packages[@]}" >&2
            exit 1
          fi
          cp "${firefox_packages[0]}" "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-firefox.zip"
          tar -tzf "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-server-linux-x86_64-gnu.tar.gz" | grep './hasilan-server'
          tar -tzf "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-web-vault.tar.gz" | grep './index.html'
          unzip -t "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-chromium.zip"
          unzip -t "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-firefox.zip"
      - name: Attest portable build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/packages/**
      - name: Preserve the offline-verifiable provenance bundle
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/copy-attestation-bundle.mjs
          "${{ steps.provenance.outputs.bundle-path }}"
          "hasilan-pass-${HP_RELEASE_VERSION}-portable-provenance.sigstore.json"
      - name: Upload portable packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-portable
          path: release
          if-no-files-found: error
          retention-days: 14

  desktop:
    name: Desktop package (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            bundles: deb,rpm,appimage
            initial-signing: not-applicable
          - platform: windows
            runner: windows-2025
            bundles: nsis,msi
            initial-signing: unsigned-smoke
    env:
      HP_NATIVE_SIGNING: ${{ matrix.initial-signing }}
      NO_STRIP: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Linux bundle prerequisites
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils rpm
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Rust
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache Cargo registry and git sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-desktop-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-desktop-
      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile --filter @hasilan/desktop...
      - name: Configure Windows Authenticode signing
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          HP_TAG_RELEASE: ${{ needs.prepare.outputs.tag_release }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $credentials = @($env:WINDOWS_CERTIFICATE, $env:WINDOWS_CERTIFICATE_PASSWORD, $env:WINDOWS_TIMESTAMP_URL)
          $present = @($credentials | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($present -ne 0 -and $present -ne $credentials.Count) {
            throw 'Windows signing credentials are only partially configured'
          }
          if ($env:HP_TAG_RELEASE -eq 'true' -and $present -ne $credentials.Count) {
            throw 'a tagged release requires Windows Authenticode credentials and a timestamp URL'
          }
          if ($present -eq 0) {
            exit 0
          }
          $timestamp = $null
          if (-not [Uri]::TryCreate($env:WINDOWS_TIMESTAMP_URL, [UriKind]::Absolute, [ref]$timestamp) -or $timestamp.Scheme -ne 'https') {
            throw 'WINDOWS_TIMESTAMP_URL must be an absolute HTTPS URL'
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'hasilan-release.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $importedCertificates = @()
          try {
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $importedCertificates = @(Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          } finally {
            Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
          }
          try {
            $privateCertificates = @($importedCertificates | Where-Object { $_.HasPrivateKey })
            if ($privateCertificates.Count -ne 1) {
              throw 'the PFX must import exactly one certificate with a private key'
            }
            $certificate = $privateCertificates[0]
            if ([string]::IsNullOrWhiteSpace($certificate.Thumbprint) -or $certificate.NotAfter -le (Get-Date)) {
              throw 'the Windows signing certificate must have a thumbprint and be unexpired'
            }
            $configuration = @{
              bundle = @{
                windows = @{
                  certificateThumbprint = $certificate.Thumbprint
                  digestAlgorithm = 'sha256'
                  timestampUrl = $env:WINDOWS_TIMESTAMP_URL
                }
              }
            }
            $configurationPath = Join-Path $env:RUNNER_TEMP 'tauri-release.json'
            $configuration | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $configurationPath -Encoding utf8
            $thumbprints = ($importedCertificates | ForEach-Object { $_.Thumbprint }) -join ';'
            "HP_TAURI_CONFIG=$configurationPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "HP_WINDOWS_THUMBPRINTS=$thumbprints" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            'HP_NATIVE_SIGNING=verified' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            foreach ($importedCertificate in $importedCertificates) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($importedCertificate.Thumbprint)" -Force -ErrorAction SilentlyContinue
            }
            throw
          }
      - name: Build Linux desktop bundles
        if: matrix.platform == 'linux'
        shell: bash
        run: pnpm --dir desktop tauri build --bundles "${{ matrix.bundles }}"
      - name: Build Windows desktop bundles
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HP_TAURI_CONFIG)) {
            pnpm --dir desktop tauri build --bundles '${{ matrix.bundles }}'
          } else {
            pnpm --dir desktop tauri build --bundles '${{ matrix.bundles }}' --config $env:HP_TAURI_CONFIG
          }
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Inspect Linux package payloads
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          mapfile -t debs < <(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print)
          mapfile -t rpms < <(find target/release/bundle/rpm -maxdepth 1 -type f -name '*.rpm' -print)
          mapfile -t appimages < <(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print)
          if [[ ${#debs[@]} -ne 1 || ${#rpms[@]} -ne 1 || ${#appimages[@]} -ne 1 ]]; then
            echo 'expected exactly one deb, rpm, and AppImage' >&2
            exit 1
          fi
          dpkg-deb --info "${debs[0]}"
          rpm -qip "${rpms[0]}"
          appimage=$(realpath "${appimages[0]}")
          appimage_extract="$RUNNER_TEMP/hasilan-appimage"
          mkdir -p "$appimage_extract"
          pushd "$appimage_extract"
          "$appimage" --appimage-extract >/dev/null
          test -x squashfs-root/usr/bin/hasilan-desktop
          popd
      - name: Verify Windows package signatures
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ($env:HP_NATIVE_SIGNING -ne 'verified') {
            exit 0
          }
          $packages = @(Get-ChildItem target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          if ($packages.Count -eq 0) {
            throw 'no Windows installer packages were produced'
          }
          foreach ($package in $packages) {
            $signature = Get-AuthenticodeSignature -FilePath $package.FullName
            if ($signature.Status -ne 'Valid') {
              throw "$($package.FullName) has invalid Authenticode status $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "$($package.FullName) does not contain an Authenticode timestamp"
            }
          }
      - name: Collect required platform packages
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/collect-tauri-bundles.mjs
          "${{ matrix.platform }}"
          "$env:HP_RELEASE_VERSION"
          "$env:HP_NATIVE_SIGNING"
        shell: pwsh
        if: matrix.platform == 'windows'
      - name: Collect required Unix platform packages
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/collect-tauri-bundles.mjs
          "${{ matrix.platform }}"
          "$HP_RELEASE_VERSION"
          "$HP_NATIVE_SIGNING"
        shell: bash
        if: matrix.platform != 'windows'
      - name: Attest desktop build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/packages/**
      - name: Preserve the offline-verifiable provenance bundle
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/copy-attestation-bundle.mjs
          "${{ steps.provenance.outputs.bundle-path }}"
          "hasilan-pass-${{ needs.prepare.outputs.version }}-${{ matrix.platform }}-provenance.sigstore.json"
      - name: Upload desktop packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-desktop-${{ matrix.platform }}
          path: release
          if-no-files-found: error
          retention-days: 14
      - name: Remove ephemeral signing identities
        if: always() && matrix.platform == 'windows'
        shell: pwsh
        run: |
          if ('${{ matrix.platform }}' -eq 'windows' -and -not [string]::IsNullOrWhiteSpace($env:HP_WINDOWS_THUMBPRINTS)) {
            foreach ($thumbprint in $env:HP_WINDOWS_THUMBPRINTS.Split(';')) {
              Remove-Item -LiteralPath "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            }
          }

  android:
    name: Signed Android APK and AAB
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@d15e628ca66d93ee5f352c71671a7bc6a97af5c9 # v6.0.8
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Java, Rust, and Android SDK components
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Configure Android SDK and Rust target
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target aarch64-linux-android
          rustup default 1.92.0
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
          printf 'NDK_HOME=%s\n' "${ANDROID_HOME}/ndk/27.3.13750724" >> "$GITHUB_ENV"
          ndk_bin="${ANDROID_HOME}/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin"
          printf '%s\n' "$ndk_bin" >> "$GITHUB_PATH"
          {
            printf 'CC_aarch64_linux_android=%s\n' "$ndk_bin/aarch64-linux-android24-clang"
            printf 'AR_aarch64_linux_android=%s\n' "$ndk_bin/llvm-ar"
            printf 'CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=%s\n' "$ndk_bin/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Cache Cargo registry and git sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-android-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'desktop/src-tauri/gen/android/**/*.gradle*', 'desktop/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-android-
      - name: Materialize and validate release signing credentials
        env:
          HP_TAG_RELEASE: ${{ needs.prepare.outputs.tag_release }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          credentials=("$ANDROID_KEYSTORE" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD")
          present=0
          for credential in "${credentials[@]}"; do
            if [[ -n "$credential" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -ne 4 ]]; then
            printf 'all four Android signing secrets are required for every release candidate\n' >&2
            exit 1
          fi
          keystore="$RUNNER_TEMP/hasilan-pass-release.jks"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$keystore"
          keytool -list -keystore "$keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          {
            printf 'HP_ANDROID_KEYSTORE=%s\n' "$keystore"
            printf 'HP_ANDROID_KEYSTORE_PASSWORD=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'HP_ANDROID_KEY_ALIAS=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'HP_ANDROID_KEY_PASSWORD=%s\n' "$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Install locked desktop dependencies
        run: pnpm install --frozen-lockfile --filter @hasilan/desktop...
      - name: Build signed Android APK and AAB
        run: pnpm --dir desktop tauri android build --target aarch64 --apk --aab --ci
      - name: Verify signatures and stage Android packages
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p release/packages release/metadata
          apk=$(find desktop/src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)
          aab=$(find desktop/src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)
          test -n "$apk"
          test -n "$aab"
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > release/metadata/android-apk-signature.txt
          jarsigner -verify -certs "$aab" > release/metadata/android-aab-signature.txt
          grep -q 'jar verified' release/metadata/android-aab-signature.txt
          cp "$apk" "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-android-arm64-v8a.apk"
          cp "$aab" "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-android-arm64-v8a.aab"
          printf '{"signing":"verified","abi":"arm64-v8a"}\n' > release/metadata/android.json
      - name: Attest Android package provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/packages/hasilan-pass-*-android-*
      - name: Preserve Android provenance bundle
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/copy-attestation-bundle.mjs
          "${{ steps.provenance.outputs.bundle-path }}"
          "hasilan-pass-${HP_RELEASE_VERSION}-android-provenance.sigstore.json"
      - name: Upload signed Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android
          path: release
          if-no-files-found: error
          retention-days: 14

  assemble:
    name: SBOM, checksums, attestations, and draft
    needs: [prepare, portable, desktop, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
      - name: Download every independently built package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Require the complete release surface
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          node scripts/verify-release-version.mjs "v${HP_RELEASE_VERSION}"
          test -f "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-server-linux-x86_64-gnu.tar.gz"
          test -f "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-web-vault.tar.gz"
          test -f "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-chromium.zip"
          test -f "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-firefox.zip"
          test -f "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-android-arm64-v8a.apk"
          test -f "release/packages/hasilan-pass-${HP_RELEASE_VERSION}-android-arm64-v8a.aab"
          test -f release/metadata/desktop-linux.json
          test -f release/metadata/desktop-windows.json
          test -f release/metadata/android.json
      - name: Generate the release SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release/metadata/hasilan-pass-${{ needs.prepare.outputs.version }}.spdx.json
          syft-version: 1.51.0
          upload-artifact: false
          upload-release-assets: false
      - name: Attest the release SBOM
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/packages/**
          sbom-path: release/metadata/hasilan-pass-${{ needs.prepare.outputs.version }}.spdx.json
      - name: Preserve the offline-verifiable SBOM attestation
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/copy-attestation-bundle.mjs
          "${{ steps.sbom-attestation.outputs.bundle-path }}"
          "hasilan-pass-${HP_RELEASE_VERSION}-sbom-attestation.sigstore.json"
      - name: Generate and verify the flat release checksum index
        run: node scripts/release-checksums.mjs release
      - name: Attest the checksum index
        id: checksums-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/SHA256SUMS
      - name: Preserve the checksum provenance bundle
        env:
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          node scripts/copy-attestation-bundle.mjs
          "${{ steps.checksums-attestation.outputs.bundle-path }}"
          "hasilan-pass-${HP_RELEASE_VERSION}-checksums-provenance.sigstore.json"
      - name: Upload the complete candidate for inspection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hasilan-pass-${{ needs.prepare.outputs.version }}-release-candidate
          path: release
          if-no-files-found: error
          retention-days: 30
      - name: Create or refresh the tagged draft release
        if: needs.prepare.outputs.tag_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HP_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mapfile -d '' release_files < <(find release -type f -print0 | sort -z)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${release_files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${release_files[@]}" --draft --verify-tag --generate-notes --title "Hasilan Pass ${HP_RELEASE_VERSION}"
          fi
