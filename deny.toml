[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2024-0429", reason = "Tauri 2's Linux WebKit runtime currently requires glib 0.18; no safe upstream upgrade exists, and Hasilan Pass does not use VariantStrIter directly" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "0BSD",
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
# Cargo reports versionless local workspace path dependencies as wildcards.
# External dependencies remain locked by Cargo.lock and are audited separately.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
